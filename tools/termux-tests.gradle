// Optional Termux ARM64 validation profile. The normal desktop suite is unchanged.
// Robolectric 4.14.1 native graphics and Conscrypt do not provide Android ARM64 binaries.
// Explicitly excludes 21 desktop graphics tests; do not report them as passing.
allprojects {
    tasks.withType(Test).configureEach {
        exclude '**/GraphProportionsTest.class'
        exclude '**/PreviewCompatibilityRegressionTest.class'
        exclude '**/RenderingProportionsTest.class'
    }
}
