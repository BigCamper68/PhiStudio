plugins {
    id 'com.android.application'
}

def releaseStorePath = providers.environmentVariable('PHISTUDIO_KEYSTORE_PATH').orNull
def releaseStorePassword = providers.environmentVariable('PHISTUDIO_KEYSTORE_PASSWORD').orNull
def releaseKeyAlias = providers.environmentVariable('PHISTUDIO_KEY_ALIAS').orNull
def releaseKeyPassword = providers.environmentVariable('PHISTUDIO_KEY_PASSWORD').orNull
def releaseSigningConfigured = [
        releaseStorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.isBlank() }

android {
    namespace 'com.xpe.mobile'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.xpe.mobile'
        minSdk 26
        targetSdk 35
        versionCode 80
        versionName '1.0.6'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug { pseudoLocalesEnabled true }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.getByName('release')
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = project.findProperty('unitTestMaxHeap') ?: '2g'
        }
    }

    androidResources { generateLocaleConfig = true }
    // All compile-time language packs must be available for offline switching in an AAB install.
    bundle {
        language {
            enableSplit false
        }
    }
    lint {
        // Partial language packs intentionally use Android resource fallback.
        disable 'MissingTranslation'
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def task = tasks.register("generate${variant.name.capitalize()}I18nResources",
                com.phistudio.build.GenerateI18nResources) {
            languageDirectory.set(rootProject.layout.projectDirectory.dir('languages'))
            // AGP assigns an isolated output directory when the source is registered below.
        }
        variant.sources.res.addGeneratedSourceDirectory(task, { it.outputDirectory })
    }
}

tasks.register('validateI18n') {
    inputs.dir(rootProject.file('languages'))
    inputs.dir('src')
    doLast {
        new com.phistudio.build.I18nGenerator(rootProject.file('languages').toPath())
        fileTree('src').matching { include '**/res/**/*.xml' }.each { source ->
            def xml = source.text.replaceAll(/(?s)<!--.*?-->/, '')
            if (xml =~ /<(string|string-array|plurals)\s|<item\b[^>]*\btype\s*=\s*['"]string['"]/) {
                throw new GradleException("Localizable resources belong in languages/*.json: ${source}")
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20240303'
}
