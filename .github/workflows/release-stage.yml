name: Publish signed PhiStudio 1.0.3

on:
  pull_request:
    branches: [main]

concurrency:
  group: publish-signed-phistudio-1.0.3
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Generate one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-key-exchange"
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -keyout "$RUNNER_TEMP/release-key-exchange/private.pem" \
            -out "$RUNNER_TEMP/release-key-exchange/public-cert.pem" \
            -days 1 \
            -subj "/CN=PhiStudio One-Time Release Signing/"

      - name: Upload one-time public certificate
        uses: actions/upload-artifact@v4
        with:
          name: PhiStudio-1.0.3-release-encryption-cert
          path: ${{ runner.temp }}/release-key-exchange/public-cert.pem
          if-no-files-found: error
          retention-days: 1

      - name: Wait for encrypted signing bundle
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 120); do
            git fetch --quiet origin "$HEAD_REF"
            if git show "origin/$HEAD_REF:release-secrets/signing-bundle.cms.b64" \
                > "$RUNNER_TEMP/release-key-exchange/signing-bundle.cms.b64" 2>/dev/null; then
              found=true
              break
            fi
            echo "Waiting for encrypted signing bundle ($attempt/120)..."
            sleep 5
          done
          if [[ "$found" != true ]]; then
            echo "Encrypted signing bundle was not supplied before timeout." >&2
            exit 1
          fi

      - name: Decrypt one-time signing bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode \
            "$RUNNER_TEMP/release-key-exchange/signing-bundle.cms.b64" \
            > "$RUNNER_TEMP/release-key-exchange/signing-bundle.cms"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/release-key-exchange/signing-bundle.cms" \
            -recip "$RUNNER_TEMP/release-key-exchange/public-cert.pem" \
            -inkey "$RUNNER_TEMP/release-key-exchange/private.pem" \
            -out "$RUNNER_TEMP/release-key-exchange/signing-bundle.tar"
          mkdir -p "$RUNNER_TEMP/release-signing"
          tar -xf "$RUNNER_TEMP/release-key-exchange/signing-bundle.tar" \
            -C "$RUNNER_TEMP/release-signing"
          test -s "$RUNNER_TEMP/release-signing/PhiStudio-release.p12"
          test -s "$RUNNER_TEMP/release-signing/password.txt"
          chmod 600 "$RUNNER_TEMP/release-signing/"*

      - name: Test, lint, and build signed release APK
        env:
          PHISTUDIO_KEYSTORE_PATH: ${{ runner.temp }}/release-signing/PhiStudio-release.p12
          PHISTUDIO_KEY_ALIAS: phistudio-release
        shell: bash
        run: |
          set -euo pipefail
          password="$(tr -d '\r\n' < "$RUNNER_TEMP/release-signing/password.txt")"
          export PHISTUDIO_KEYSTORE_PASSWORD="$password"
          export PHISTUDIO_KEY_PASSWORD="$password"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PhiStudio-1.0.3.apk

      - name: Verify release signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs PhiStudio-1.0.3.apk
          sha="$(sha256sum PhiStudio-1.0.3.apk | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## PhiStudio 1.0.3

          Signed Android release built from commit \`91cf2b07e7732851c93d17bfd3ec7f97f5b9fa38\` on \`main\`.

          ### Changes

          - Fixed RPE/Phira compatibility for delayed event layers that could cause extreme judge-line rotation.
          - Added canonical \`info.txt\` generation to exported chart packages.
          - Preserved authored geometry and angles in previews with non-3:2 viewports.
          - Added automated unit-test and lint verification for Android builds.

          ### Requirements

          Android 8.0 (API 26) or newer.

          ### Integrity

          \`SHA-256: $APK_SHA256\`
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.3
          TITLE: PhiStudio 1.0.3
          SOURCE_SHA: 91cf2b07e7732851c93d17bfd3ec7f97f5b9fa38
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" PhiStudio-1.0.3.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" PhiStudio-1.0.3.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi

      - name: Close staging PR and remove temporary branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment "PhiStudio 1.0.3 has been published as a signed GitHub Release."
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
