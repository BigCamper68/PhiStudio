name: Release Stage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-release-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test, lint, and build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Collect release inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-stage
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            release-stage/PhiStudio-1.0.3-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" \
            release-stage/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            release-stage/zipalign
          libcxx="$(find "$ANDROID_HOME/build-tools/35.0.0" -name 'libc++.so' -print -quit)"
          test -n "$libcxx"
          cp "$libcxx" release-stage/libc++.so
          chmod +x release-stage/zipalign

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: PhiStudio-1.0.3-release-stage
          path: release-stage/
          if-no-files-found: error
          retention-days: 7
