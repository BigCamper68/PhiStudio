name: Publish PhiStudio 1.0.3

on:
  pull_request:
    branches: [main]

concurrency:
  group: publish-phistudio-1.0.3
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release staging branch
        uses: actions/checkout@v4

      - name: Check release payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for part in \
            release-assets/PhiStudio-1.0.3.apk.b64.part-01 \
            release-assets/PhiStudio-1.0.3.apk.b64.part-02 \
            release-assets/PhiStudio-1.0.3.apk.b64.part-03; do
            if [[ ! -f "$part" ]]; then
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != true ]]; then
            echo "Signed release payload is not complete yet; skipping publication."
          fi

      - name: Reconstruct and verify signed APK
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            release-assets/PhiStudio-1.0.3.apk.b64.part-01 \
            release-assets/PhiStudio-1.0.3.apk.b64.part-02 \
            release-assets/PhiStudio-1.0.3.apk.b64.part-03 \
            | base64 --decode > PhiStudio-1.0.3.apk
          echo "fc0905205e284f2ba9b5dd7431a1f98281c01ab4e3f870f150b04b04280d8ac0  PhiStudio-1.0.3.apk" \
            | sha256sum --check --strict

      - name: Write release notes
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## PhiStudio 1.0.3

          Signed Android release built from commit `91cf2b07e7732851c93d17bfd3ec7f97f5b9fa38` on `main`.

          ### Changes

          - Fixed RPE/Phira compatibility for delayed event layers that could cause extreme judge-line rotation.
          - Added canonical `info.txt` generation to exported chart packages.
          - Preserved authored geometry and angles in previews with non-3:2 viewports.
          - Added automated unit-test and lint verification for Android builds.

          ### Requirements

          Android 8.0 (API 26) or newer.

          ### Integrity

          `SHA-256: fc0905205e284f2ba9b5dd7431a1f98281c01ab4e3f870f150b04b04280d8ac0`
          EOF

      - name: Create or update GitHub Release
        if: steps.payload.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.3
          TITLE: PhiStudio 1.0.3
          SOURCE_SHA: 91cf2b07e7732851c93d17bfd3ec7f97f5b9fa38
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" PhiStudio-1.0.3.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" PhiStudio-1.0.3.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi

      - name: Close staging PR and remove temporary branch
        if: steps.payload.outputs.ready == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment "PhiStudio 1.0.3 has been published as a signed GitHub Release."
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
