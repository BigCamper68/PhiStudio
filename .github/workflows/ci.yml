name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests, lint, and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Name APK artifact
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk PhiStudio-1.0.3-phira-fix-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhiStudio-1.0.3-phira-fix-debug
          path: PhiStudio-1.0.3-phira-fix-debug.apk
          if-no-files-found: error
          retention-days: 30
