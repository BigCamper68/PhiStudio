name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests, lint, and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -p buildSrc --no-daemon test
          python3 tools/i18n/verify_translations.py
          ./gradlew --no-daemon validateI18n testDebugUnitTest lintDebug assembleDebug generateReleaseLocaleConfig
          python3 tools/i18n/verify_locale_config.py

      - name: Name APK artifact
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "PhiStudio-${version}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhiStudio-${{ steps.apk.outputs.version }}-debug
          path: PhiStudio-${{ steps.apk.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30
