name: Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_info.outputs.should_release }}
      version: ${{ steps.release_info.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release_info
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"
          if [[ -z "$release_version" ]]; then
            echo "Unable to read versionName from app/build.gradle" >&2
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          if gh release view "v${release_version}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release v${release_version} already exists; nothing to publish."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHISTUDIO_KEYSTORE_PASSWORD: ${{ secrets.PHISTUDIO_KEYSTORE_PASSWORD }}
      PHISTUDIO_KEY_ALIAS: ${{ secrets.PHISTUDIO_KEY_ALIAS }}
      PHISTUDIO_KEY_PASSWORD: ${{ secrets.PHISTUDIO_KEY_PASSWORD }}
      PHISTUDIO_KEYSTORE_BASE64: ${{ secrets.PHISTUDIO_KEYSTORE_BASE64 }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate tag and signing configuration
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          source_version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"
          if [[ -z "$source_version" || "$RELEASE_VERSION" != "$source_version" ]]; then
            echo "Resolved release version $RELEASE_VERSION does not match app version $source_version" >&2
            exit 1
          fi
          for variable_name in PHISTUDIO_KEYSTORE_BASE64 PHISTUDIO_KEYSTORE_PASSWORD PHISTUDIO_KEY_ALIAS PHISTUDIO_KEY_PASSWORD; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Required Actions secret $variable_name is missing" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/phistudio-release.p12"
          printf '%s' "$PHISTUDIO_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storetype PKCS12 \
            -storepass "$PHISTUDIO_KEYSTORE_PASSWORD" \
            -alias "$PHISTUDIO_KEY_ALIAS" >/dev/null
          echo "PHISTUDIO_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Run tests, lint, and signed release build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest lintRelease assembleRelease

      - name: Verify and package release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          apk_source="app/build/outputs/apk/release/app-release.apk"
          apk_name="PhiStudio-${RELEASE_VERSION}.apk"
          source_name="PhiStudio-${RELEASE_VERSION}-source.zip"
          test -s "$apk_source"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk_source"
          cp "$apk_source" "$apk_name"
          git archive --format=zip --prefix="PhiStudio-${RELEASE_VERSION}/" --output="$source_name" HEAD
          sha256sum "$apk_name" "$source_name" > SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhiStudio-${{ needs.prepare.outputs.version }}
          path: |
            PhiStudio-${{ needs.prepare.outputs.version }}.apk
            PhiStudio-${{ needs.prepare.outputs.version }}-source.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          notes_file=".github/release-notes/${release_tag}.md"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            tag_arguments=(--verify-tag)
          else
            tag_arguments=(--target "$GITHUB_SHA")
          fi
          if [[ -f "$notes_file" ]]; then
            notes_arguments=(--notes-file "$notes_file")
          else
            notes_arguments=(--generate-notes)
          fi
          gh release create "$release_tag" \
            "PhiStudio-${RELEASE_VERSION}.apk#Signed Android APK" \
            "PhiStudio-${RELEASE_VERSION}-source.zip#Source code" \
            "SHA256SUMS.txt#SHA-256 checksums" \
            --title "PhiStudio ${RELEASE_VERSION}" \
            "${notes_arguments[@]}" \
            "${tag_arguments[@]}"

  sync-release-notes:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Update existing release description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          notes_file=".github/release-notes/${release_tag}.md"
          test -s "$notes_file"
          gh release edit "$release_tag" \
            --title "PhiStudio ${RELEASE_VERSION}" \
            --notes-file "$notes_file"
